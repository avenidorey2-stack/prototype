<html lang="en">
<head>

<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<style>
:root{--bg:#eef0f3;--surface:#fff;--fg:#1c2330;--muted:#5d6879;--line:#cfd5de;--accent:#2f6fb5;--accent-fg:#fff;--yellow:#f5d34a;--green:#cfeedd;--green-fg:#14633a;--amber:#f3efb5;--amber-fg:#6a5d0a;--chip:#e6eaf0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--surface:#1b212b;--fg:#e7ebf2;--muted:#9aa5b6;--line:#343c4a;--accent:#5b9be0;--accent-fg:#0b1018;--green:#1d4a33;--green-fg:#aee8c8;--amber:#4a4515;--amber-fg:#efe59a;--chip:#2a313d}}
:root[data-theme="dark"]{--bg:#12161d;--surface:#1b212b;--fg:#e7ebf2;--muted:#9aa5b6;--line:#343c4a;--accent:#5b9be0;--accent-fg:#0b1018;--green:#1d4a33;--green-fg:#aee8c8;--amber:#4a4515;--amber-fg:#efe59a;--chip:#2a313d}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Barlow',system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.logo{font-family:'Barlow Condensed','Barlow',sans-serif;letter-spacing:.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(20,30,50,.07)}
.inp{width:100%;background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:6px;padding:.5rem .65rem}
.inp:focus-visible,button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-fg);border-radius:6px;padding:.5rem 1rem;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn-y{background:var(--yellow);color:#2a2200;border-radius:6px;padding:.55rem 1.1rem;font-weight:700;border:1.5px solid #c9a91d}
.btn-o{border:1.5px solid var(--fg);border-radius:6px;padding:.3rem .8rem;font-weight:500;background:var(--surface)}
.lnk{color:var(--accent);text-decoration:underline;cursor:pointer}
.mut{color:var(--muted)}
.chip{background:var(--chip);border-radius:999px;padding:.1rem .6rem;font-size:.8rem}
.tabon{border-bottom:2.5px solid var(--accent);color:var(--accent);font-weight:600}
.bar{border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
button{transition:filter .15s,background-color .15s,transform .15s}
.btn:active,.btn-y:active{transform:translateY(1px)}
.btn-o:hover{background:var(--chip)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

code:<><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></>,
back:<path d="M19 12H5m7-7-7 7 7 7"/>,
mic:<><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></>,

};
const I=({n,s=20,c=""})=><svg className={c} width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{P[n]}</svg>;

const JOBS=[
{id:1,t:"UI/UX Designer",co:"TechCorp",loc:"Remote",type:"Full-time",m:95,pay:"$90k - $120k",lvl:"Medium",ic:"brief",skills:["Figma","User Flows","Prototyping"],sch:"Full Schedule Fit",d:"Collaborate with product and engineering teams to design user-friendly, visually engaging digital experiences. Focus on user flows, wireframes, and high-fidelity mockups...",req:["3+ years UI/UX Experience","Experience with Figma & Mockups","Portfolio required"]},
{id:2,t:"Product Designer",co:"DesignHub",loc:"Chicago",type:"Full-time",m:91,pay:"$85k - $110k",lvl:"Medium",ic:"user",skills:["Wireframing","Research"],sch:"Full Schedule Fit",d:"Own the end-to-end design of core product features, from discovery to polished handoff.",req:["2+ years product design","Strong portfolio","Figma proficiency"]},
{id:3,t:"Interaction Designer",co:"Growth Co",loc:"Remote",type:"Part-time",m:88,pay:"$45k - $60k",lvl:"Medium",ic:"user",skills:["Interaction Design","User Flows"],sch:"Full Schedule Fit",d:"Design micro-interactions and motion patterns for a growing consumer app.",req:["Prototyping experience","Portfolio required","Motion basics"]},
{id:4,t:"Interaction Designer",co:"Innovotech",loc:"San Francisco",type:"Full-time",m:72,pay:"$100k - $130k",lvl:"High",ic:"user",skills:["User Flows","Prototyping"],sch:"Partial Schedule Fit: Check Thu/Fri",d:"Shape interaction models for enterprise tools used by thousands of teams.",req:["4+ years experience","Systems thinking","Portfolio required"]},
{id:5,t:"Sr. UI/UX Designer",co:"Bytiris",loc:"New York",type:"Full-time",m:65,pay:"$110k - $150k",lvl:"High",ic:"brief",skills:["Figma","User Flows","Prototyping"],sch:"Partial Schedule Fit: Check Mon/Wed",d:"Lead design for a flagship analytics product.",req:["5+ years experience","Leadership experience","Portfolio required"]},
{id:6,t:"UX Researcher",co:"Bytiris",loc:"Remote",type:"Part-time",m:58,pay:"$50k - $70k",lvl:"Medium",ic:"search",skills:["User Research","Surveys"],sch:"Partial Schedule Fit: Check Thu/Fri",d:"Plan and run usability studies and synthesize findings for product teams.",req:["Research methods","Clear writing","Portfolio required"]},
{id:7,t:"Full Stack Developer",co:"CodeCrafters",loc:"New York",type:"Full-time",m:44,pay:"$100k - $140k",lvl:"High",ic:"code",skills:["React","Node"],sch:"Partial Schedule Fit: Check Tue/Thu",d:"Build and ship features across our React and Node stack.",req:["3+ years full stack","React + Node","Git workflow"]},
{id:8,t:"Product Manager",co:"Innosphere",loc:"San Francisco",type:"Full-time",m:32,pay:"$120k - $160k",lvl:"High",ic:"brief",skills:["Roadmaps","Skills"],sch:"Partial Schedule Fit: Check Thu/Fri",d:"Define roadmap and priorities with design and engineering leads.",req:["4+ years PM","Analytics","Stakeholder skills"]},
{id:9,t:"Digital Marketing Assistant",co:"BrightLeaf",loc:"Remote",type:"Part-time",m:61,pay:"$35k - $50k",lvl:"Low",ic:"search",skills:["Social Media","Analytics"],sch:"Full Schedule Fit",d:"Support campaigns, schedule posts and report weekly results.",req:["Strong writing","Basic analytics","Flexible evenings"]},
{id:10,t:"Industry Insights Analyst",co:"MarketLens",loc:"Chicago",type:"Part-time",m:54,pay:"$40k - $55k",lvl:"Low",ic:"search",skills:["Research","Surveys"],sch:"Partial Schedule Fit: Check Mon/Tue",d:"Track hiring trends and turn them into short weekly briefs.",req:["Research methods","Clear writing","Spreadsheet skills"]},
{id:11,t:"Visual Designer",co:"Pixelhouse",loc:"New York",type:"Full-time",m:79,pay:"$80k - $105k",lvl:"Medium",ic:"user",skills:["Figma","Branding"],sch:"Full Schedule Fit",d:"Create brand and campaign visuals across web and social.",req:["2+ years design","Figma proficiency","Portfolio required"]},
{id:12,t:"Frontend Developer",co:"Northwind",loc:"Remote",type:"Full-time",m:68,pay:"$95k - $125k",lvl:"Medium",ic:"code",skills:["React","Prototyping"],sch:"Partial Schedule Fit: Check Wed/Fri",d:"Turn designs into fast, accessible React interfaces.",req:["2+ years React","CSS fluency","Git workflow"]},
];
const APPS=[
["Sr. UI/UX Designer","TechCorp","(Yesterday)","Submitted","send",1],
["Interaction Designer","Gronote","5 days ago","In Review","clock",0],
["UX Researcher","Bytris","2 days ago","Received","ok",0],
["Product Manager","Innosphere","10 days ago","Interviews","cal",0],
["Full Stack Developer","CodeCrafters","(Today)","Submitted","send",1],
];
const statusLabel={Submitted:"Submitted","In Review":"In Review",Received:"Application Received",Interviews:"Interview Scheduled"};

const Logo=({onClick})=><button onClick={onClick} className="flex items-center gap-2 logo text-2xl font-bold" aria-label="JOB-FILTER.COM home">JOB-FILTER.COM<I n="search" s={26} c="text-[var(--accent)]"/></button>;
const Toggle=({on,set,label})=><button role="switch" aria-checked={on} aria-label={label} onClick={()=>set(!on)} className="w-11 h-6 rounded-full relative border-[1.5px] border-[var(--line)]" style={{background:on?"var(--accent)":"var(--chip)"}}><span className="absolute top-[2px] w-4 h-4 rounded-full bg-white transition-all" style={{left:on?"22px":"3px"}}/></button>;
const StarRow=()=><span className="flex">{[0,1,2,3,4].map(i=><svg key={i} className="shrink-0" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="12 2 15.1 8.3 22 9.3 17 14.1 18.2 21 12 17.8 5.8 21 7 14.1 2 9.3 8.9 8.3"/></svg>)}</span>;
const Stars=({m})=><span className="relative inline-flex" style={{color:"var(--line)"}}><StarRow/><span className="absolute inset-y-0 left-0 overflow-hidden" style={{width:m+"%",color:"#e8a317"}}><StarRow/></span></span>;
const MY=["ux/ui design","wireframing","prototyping","figma","user research","interaction design"];
function explain(j){
  const hits=j.skills.filter(s=>MY.some(p=>p.includes(s.toLowerCase())||s.toLowerCase().includes(p))),miss=j.skills.filter(s=>!hits.includes(s));
  return [
    [hits.length>0,"Skills: your profile covers "+(hits.length?hits.join(", "):"none of the required skills")+" ("+hits.length+" of "+j.skills.length+")."+(miss.length?" Missing: "+miss.join(", ")+".":"")],
    [/design|ux|ui|research/i.test(j.t),"Role: \u201c"+j.t+"\u201d "+(/design|ux|ui|research/i.test(j.t)?"fits your UX/UI design experience.":"is outside your UX/UI background.")],
    [j.sch.startsWith("Full"),j.sch.startsWith("Full")?"Schedule: the hours fit your availability (Mon\u2013Fri, 4pm\u20139pm).":"Schedule: partial fit. Check "+j.sch.split("Check ")[1]+", which may clash with your classes."],
    [j.loc==="Remote"||j.loc==="New York",j.loc==="Remote"?"Location: remote, so no commute around your classes.":j.loc==="New York"?"Location: New York matches your profile location.":"Location: "+j.loc+" is outside your profile location (New York, NY)."],
    [j.lvl!=="High",j.lvl==="High"?"Experience: asks for senior-level experience, above what your profile shows.":"Experience: "+j.lvl.toLowerCase()+"-level fits your background."],
  ];
}
const burstPts=Array.from({length:32},(_,i)=>{const a=i*Math.PI/16,r=i%2?39:50;return (50+r*Math.sin(a)).toFixed(1)+","+(50-r*Math.cos(a)).toFixed(1)}).join(" ");
const Burst=({m})=><span className="relative inline-flex items-center justify-center shrink-0" style={{width:48,height:48}}><svg className="absolute inset-0" viewBox="0 0 100 100" aria-hidden="true"><polygon points={burstPts} fill={m>=80?"#1a8f4c":m>=50?"#c96a00":"#d62828"}/></svg><span className="relative text-white font-bold text-[.82rem] leading-none">{m}%</span></span>;
function Badge({m}){
  const [open,setOpen]=useState(false),[right,setRight]=useState(false),ref=React.useRef(null),j=JOBS.find(x=>x.m===m),good=m>=80;
  React.useEffect(()=>{if(!open)return;const h=e=>{if(e.type==="keydown"?e.key==="Escape":ref.current&&!ref.current.contains(e.target))setOpen(false)};document.addEventListener("mousedown",h);document.addEventListener("keydown",h);return()=>{document.removeEventListener("mousedown",h);document.removeEventListener("keydown",h)}},[open]);
  return <span ref={ref} className={"relative inline-block align-middle "+(open?"z-30":"")}><button type="button" onClick={()=>{if(!open&&ref.current)setRight(ref.current.getBoundingClientRect().left+300>window.innerWidth);setOpen(!open)}} aria-expanded={open} aria-label={m+"% match. Show why"} title="Why this match?" className="inline-flex items-center gap-2 rounded-full"><Burst m={m}/><Stars m={m}/></button>
  {open&&j&&<div role="dialog" aria-label="Why this match" className={"card absolute top-full mt-2 z-30 w-72 max-w-[78vw] p-3 text-left text-sm font-normal shadow-xl "+(right?"right-0":"left-0")} style={{color:"var(--fg)"}}>
    <b className="text-base">Why {m}%?</b>
    <ul className="mt-2 space-y-2">{explain(j).map(([ok,t],i)=><li key={i} className="flex gap-2"><I n={ok?"ok":"clock"} s={16} c="shrink-0 mt-0.5"/><span>{t}</span></li>)}</ul>
    <p className="mut mt-3">Full matches add more to the score than partial ones.</p></div>}</span>;
}

function Modal({job,onClose,onApply,onSave,saved,user}){
  React.useEffect(()=>{const h=e=>e.key==="Escape"&&onClose();window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h)},[]);
  return <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{background:"rgba(10,14,20,.6)"}} onClick={onClose}>
    <div role="dialog" aria-modal="true" className="card max-w-lg w-full p-6 max-h-full overflow-auto" onClick={e=>e.stopPropagation()}>
      <div className="flex justify-between items-start"><h2 className="text-lg font-semibold">JOB DETAILS</h2><button onClick={onClose} aria-label="Close"><I n="x"/></button></div>
      <h3 className="text-3xl font-semibold mt-1">{job.t} at {job.co}</h3>
      <div className="flex flex-wrap items-center gap-2 my-4 text-sm"><span className="chip">{job.loc}</span><span className="chip">{job.type}</span>{user&&<Badge m={job.m}/>}<span className="chip">{job.pay}</span></div>
      <h4 className="font-semibold">Job Description</h4><p className="mb-3">{job.d}</p>
      <h4 className="font-semibold">Requirements</h4>
      <ul className="mb-4">{job.req.map(r=><li key={r} className="flex gap-2 items-center"><I n="ok" s={16} c="text-[var(--accent)]"/>{r}</li>)}</ul>
      <div className="flex gap-3"><button className="btn-y" autoFocus onClick={onApply}>APPLY NOW</button></div>
    </div></div>;
}

function Home({go,openJob,user}){
  const [q,setQ]=useState(""),[l,setL]=useState(""),[res,setRes]=useState(null),[n,setN]=useState(3);
  const find=e=>{e&&e.preventDefault();const k=q.toLowerCase(),lc=l.toLowerCase();
    const toks=k.split(/[\s/,]+/).filter(Boolean);const hit=j=>!toks.length||toks.some(t=>(j.t+" "+j.co+" "+j.skills.join(" ")).toLowerCase().includes(t));const lw=j=>lc&&j.loc.toLowerCase().includes(lc)?1:0;const r=JOBS.filter(hit).sort((a,b)=>lw(b)-lw(a)||b.m-a.m);setN(3);
    setRes(r.length?r:JOBS.slice().sort((a,b)=>b.m-a.m));};
  return <div className="min-h-screen">
    <header className="bar flex items-center justify-between px-5 py-3"><Logo onClick={()=>setRes(null)}/>
      <nav className="flex gap-2">{user?<button className="btn-o" onClick={()=>go("app")}>Dashboard</button>:<button className="btn-o" onClick={()=>go("signin")}>Sign In</button>}<button className="btn-o" onClick={()=>go("about")}>About</button><button className="btn-o" onClick={()=>go("help")}>Help</button></nav></header>
    <main className="max-w-2xl mx-auto px-4 pt-14 sm:pt-20 pb-16 text-center">
      <h1 className="text-4xl sm:text-6xl font-semibold text-balance leading-[1.05]">YOUR ALL-IN-ONE JOB SEARCH HUB</h1>
      <p className="text-lg mt-3 mb-10">Filter. Match. Apply. Simple as that!</p>
      <form onSubmit={find} className="card flex flex-wrap items-stretch overflow-hidden text-left shadow-lg" style={{borderColor:"var(--accent)",borderWidth:2}}>
        <label className="flex items-center gap-2 px-3 flex-1 min-w-[10rem]"><span className="sr-only">Job title</span><input className="w-full py-3 bg-transparent outline-none" placeholder="Job Title, Keywords..." value={q} onChange={e=>setQ(e.target.value)}/><I n="search" s={18} c="mut"/></label>
        <label className="flex items-center gap-2 px-3 flex-1 min-w-[9rem] border-l border-[var(--line)]"><I n="pin" s={18} c="mut"/><span className="sr-only">Location</span><input className="w-full py-3 bg-transparent outline-none" placeholder="Location..." value={l} onChange={e=>setL(e.target.value)}/></label>
        <button type="submit" className="btn-y m-1.5">FIND MATCHED JOBS</button></form>
      {!res?<div className="mt-12"><div className="inline-flex p-6 card"><I n="search" s={56} c="text-[var(--accent)]"/></div><p className="mt-4 text-lg font-medium">Find the right jobs with the click of a button!</p><p className="mut">Matches will appear here</p></div>
      :<section className="mt-6 text-left"><h2 className="text-xl font-semibold mb-2">MATCHED JOBS ({res.length})</h2>
        <div className="space-y-3">{res.slice(0,n).map(j=><div key={j.id} className="card p-4 flex items-center justify-between gap-3 transition hover:shadow-md"><div><div className="flex items-center gap-2 flex-wrap"><span className="text-xl font-semibold">{j.t}</span>{user?<Badge m={j.m}/>:<button className="lnk text-sm" onClick={()=>go("signin")}>Sign in to see your match</button>}</div><div className="mut text-sm">{j.co}</div><div className="text-sm">{j.loc}{j.loc==="Chicago"?" (Hybrid)":""} • {j.type}</div></div><button className="btn-o" onClick={()=>openJob(j)}>View</button></div>)}</div>
        {n<res.length&&<div className="text-center mt-4"><button className="btn-o" onClick={()=>setN(n+3)}>Load More</button></div>}</section>}
    </main></div>;
}

function Shell({children,children2,go}){return <div className="min-h-screen"><div className="max-w-4xl mx-auto px-4 pt-4"><div className="flex items-center justify-between"><Logo onClick={()=>go("home")}/></div></div><main className="px-4 py-6">{children}</main></div>;}

function Auth({page,go,job,setUser,pendingJob}){
  const [email,setEmail]=useState(""),[pw,setPw]=useState(""),[rem,setRem]=useState(false),[err,setErr]=useState("");
  const [re,setRe]=useState("support@job-filter.com"),[nm,setNm]=useState(""),[p2,setP2]=useState("");
  React.useEffect(()=>{setErr("")},[page]);
  const target=job?`${job.t} position at ${job.co}`:"the position";
  const back=<button className="mt-5 flex items-center gap-1 mx-auto" onClick={()=>go("home")}><I n="back" s={16}/> Go Back to Matches</button>;
  const box="card max-w-sm mx-auto p-5 ";
  if(page==="signin")return <Shell go={go}><div className="text-center"><h1 className="text-4xl font-semibold">SIGN IN TO YOUR ACCOUNT</h1><p className="mb-4">You’re one step away! Please sign in to apply for the {target}.</p>
    <form className={box+"text-left"} onSubmit={e=>{e.preventDefault();if(!email||!pw)return setErr("Enter your email and password.");setUser(true);go("app");}}>
      <h2 className="text-center text-xl font-semibold mb-2">SIGN IN</h2>
      <label className="block">Email Address<input className="inp" type="email" value={email} onChange={e=>setEmail(e.target.value)}/></label>
      <label className="block mt-2">Password<input className="inp" type="password" value={pw} onChange={e=>setPw(e.target.value)}/></label>
      {err&&<p role="alert" className="text-sm mt-1" style={{color:"#d64545"}}>{err}</p>}
      <div className="flex justify-between text-sm my-3"><label className="flex gap-1 items-center"><input type="checkbox" checked={rem} onChange={e=>setRem(e.target.checked)}/>Remember me</label><button type="button" className="lnk" onClick={()=>go("reset")}>Forgot password?</button></div>
      <div className="text-center"><button className="btn px-8" type="submit">SIGN IN</button></div>
      <p className="text-center text-sm mt-3">Don’t have an account? <button type="button" className="lnk" onClick={()=>go("create")}>Create an account</button></p></form>{back}</div></Shell>;

function Chat({setTab}){
  const [open,setOpen]=useState(false),[txt,setTxt]=useState(""),[typing,setTyping]=useState(false);
  const [msgs,setMsgs]=useState([{b:1,t:"Hi Jane! 👋 I can help you update your schedule PDF or edit your availability settings. What would you like to do?"}]);
  const end=React.useRef(null);
  React.useEffect(()=>{end.current&&end.current.scrollIntoView({block:"end"})},[msgs,typing,open]);
  React.useEffect(()=>{if(!open)return;const h=e=>e.key==="Escape"&&setOpen(false);window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h)},[open]);
  const reply=s=>{const k=s.toLowerCase();
    if(/^other/.test(k))return {t:"Sure. Ask me about job matches, your applications, your profile or your account."};
    if(/availab/.test(k))return {t:"You can change the times you can work under Study Load & Schedule Settings. Choose Edit Availability Times.",a:["Open availability settings","settings"]};
    if(/schedule|class|timetable|pdf|scan/.test(k))return {t:"Open Settings and find Study Load & Schedule Settings. Upload a PDF or scan of your study schedule there, and I’ll filter for roles that fit around your classes.",a:["Open schedule settings","settings"]};
    if(/notif|alert|email/.test(k))return {t:"Notification Preferences in Settings let you turn new job alerts and application status updates on or off.",a:["Open notification settings","settings"]};
    if(/match|%/.test(k))return {t:"Your match % compares your profile, skills and availability with each job’s requirements. Partial schedule fits show which days to check.",a:["See job matches","matches"]};
    if(/appl|status|interview|withdraw/.test(k))return {t:"My Applications lists every job you’ve applied to, with its status. You can withdraw a submitted application there.",a:["Open My Applications","apps"]};
    if(/resume|cv|profile|skill|experience/.test(k))return {t:"My Profile is where you upload a new resume and edit your details, work experience and skills.",a:["Open My Profile","profile"]};
    if(/password|account|delete|privacy|data|visib/.test(k))return {t:"Account, privacy and data options (password, profile visibility, download or delete your data) are under Settings.",a:["Open Settings","settings"]};
    return {t:"I can help with your schedule, notifications, job matches, applications and profile. Try one of the quick replies below."};};
  const send=s=>{s=s.trim();if(!s)return;setMsgs(m=>[...m,{t:s}]);setTxt("");setTyping(true);setTimeout(()=>{setTyping(false);setMsgs(m=>[...m,{b:1,...reply(s)}])},600);};
  return <>{open&&<section role="dialog" aria-label="JOB-FILTER AI chat" className="card fixed z-40 right-4 flex flex-col w-[22rem] max-w-[calc(100vw-2rem)] h-[30rem] max-h-[calc(100vh-7rem)] shadow-xl" style={{bottom:"calc(4.75rem + env(safe-area-inset-bottom,0px))"}}>
    <header className="flex items-center gap-2 px-3 py-2 border-b border-[var(--line)]"><I n="bot" s={22} c="text-[var(--accent)]"/><h2 className="text-lg font-semibold flex-1">JOB-FILTER AI</h2><button onClick={()=>setOpen(false)} aria-label="Close chat"><I n="x" s={18}/></button></header>
    <div className="flex-1 overflow-y-auto p-3 space-y-2" aria-live="polite">{msgs.map((m,i)=><div key={i} className={m.b?"flex":"flex justify-end"}><div className="max-w-[85%] rounded-xl px-3 py-2 text-[.95rem]" style={m.b?{background:"var(--chip)"}:{background:"var(--accent)",color:"var(--accent-fg)"}}>{m.t}{m.a&&<div className="mt-2"><button className="btn-o text-sm" onClick={()=>{setTab(m.a[1]);setOpen(false);}}>{m.a[0]}</button></div>}</div></div>)}
      {typing&&<div className="flex"><div className="rounded-xl px-3 py-2 mut" style={{background:"var(--chip)"}}>Typing…</div></div>}<div ref={end}/></div>
    <div className="flex flex-wrap gap-2 px-3 pb-2">{["Help with schedule","Change notification settings","Other..."].map(c=><button key={c} className="btn-o !rounded-full text-sm" onClick={()=>send(c)}>{c}</button>)}</div>
    <form className="flex items-center gap-2 p-3 border-t border-[var(--line)]" onSubmit={e=>{e.preventDefault();send(txt);}}><label className="flex-1"><span className="sr-only">Message</span><input className="inp" placeholder="Ask me anything..." value={txt} onChange={e=>setTxt(e.target.value)}/></label>
      <button type="button" aria-label="Voice input" onClick={()=>alert("Voice input isn’t available in this prototype.")}><I n="mic" s={20}/></button><button type="submit" className="btn !px-3" aria-label="Send message"><I n="send" s={18}/></button></form></section>}
    <button onClick={()=>setOpen(!open)} aria-expanded={open} aria-label={open?"Close AI chat":"Open AI chat"} className="fixed z-40 right-4 flex items-center gap-1.5 rounded-full px-4 py-3 font-bold shadow-lg" style={{bottom:"calc(1rem + env(safe-area-inset-bottom,0px))",background:"var(--accent)",color:"var(--accent-fg)"}}>AI<I n="star" s={16}/></button></>;
}
window.alert=m=>window.dispatchEvent(new CustomEvent("toast",{detail:m}));
function Toast(){const [m,setM]=useState("");React.useEffect(()=>{let t;const h=e=>{setM(e.detail);clearTimeout(t);t=setTimeout(()=>setM(""),3200)};window.addEventListener("toast",h);return()=>window.removeEventListener("toast",h)},[]);return m?<div role="status" className="fixed left-1/2 -translate-x-1/2 bottom-6 z-[60] px-4 py-2 rounded-lg shadow-lg max-w-[90vw]" style={{background:"var(--fg)",color:"var(--bg)"}}>{m}</div>:null}
function App(){
  const [screen,setScreen]=useState("home"),[tab,setTab]=useState("dash"),[job,setJob]=useState(null),[pending,setPending]=useState(null),[user,setUserRaw]=useState(false),[saved,setSaved]=useState({}),[apps,setApps]=useState(APPS);
  const addApp=j=>setApps(a=>a.some(x=>x[0]===j.t&&x[1]===j.co)?a:[[j.t,j.co,"(Today)","Submitted","send",1],...a]);
  const setUser=v=>{setUserRaw(v);if(v&&pending){addApp(pending);setTab("apps");alert("Application to "+pending.t+" at "+pending.co+" submitted.");setPending(null);}};
  const go=(s,x)=>{setScreen(s);window.scrollTo(0,0);if(s==="app")setTab(t=>t);};
  const apply=()=>{const j=job;setJob(null);if(user){if(apps.some(x=>x[0]===j.t&&x[1]===j.co))alert("You’ve already applied to this job.");else{addApp(j);alert("Application to "+j.t+" at "+j.co+" submitted.");}setScreen("app");setTab("apps");}else{setPending(j);go("signin");}};
  const modal=job&&<Modal job={job} user={user} onClose={()=>setJob(null)} onApply={apply} saved={saved[job.id]} onSave={()=>{setSaved({...saved,[job.id]:1});alert("Saved “"+job.t+"” to your list.");}}/>;
  if(screen==="app")return <><AppShell tab={tab} setTab={setTab} go={go} out={()=>{setUser(false);setTab("dash");go("home");alert("You’ve been signed out.");}}>
    {tab==="dash"&&<Dash setTab={setTab} total={28+apps.length-APPS.length}/>}{tab==="matches"&&<Matches openJob={setJob}/>}{tab==="apps"&&<Apps apps={apps} openJob={setJob}/>}{tab==="profile"&&<Profile/>}{tab==="settings"&&<Settings go={go} setUser={setUser}/>}</AppShell><Chat setTab={setTab}/>{modal}</>;
  if(screen==="about"||screen==="help")return <Info page={screen} go={go} user={user}/>;
  if(screen==="home")return <><Home go={go} openJob={setJob} user={user}/>{modal}</>;
  return <Auth page={screen} go={go} job={pending} setUser={setUser}/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<><App/><Toast/></>);
</script>
</body>
